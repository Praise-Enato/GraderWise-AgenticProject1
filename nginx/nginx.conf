events {
    worker_connections 1024;
}

http {
    # Allow plan-PDF and course-material uploads (vision grading + /ingest).
    # Keep in sync with MAX_UPLOAD_BYTES in backend/src/main.py.
    client_max_body_size 25m;

    upstream frontend {
        server frontend:3000;
    }

    upstream backend {
        server backend:8000;
    }

    server {
        listen 80;

        # 1. Main Website (Frontend)
        location / {
            proxy_pass http://frontend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # 2. Next.js API Routes (Frontend)
        location /api/submissions {
            proxy_pass http://frontend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /api/educator {
             proxy_pass http://frontend;
             proxy_set_header Host $host;
             proxy_set_header X-Real-IP $remote_addr;
        }

        # 3. Python API Routes (Backend)
        location /api/ {
            rewrite ^/api/(.*) /$1 break;
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}