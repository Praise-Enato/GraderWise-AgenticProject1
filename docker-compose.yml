version: '3.8'

services:
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
      - frontend
    networks:
      - grade-net

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:             
      - "8000:8000"    # <--- WE UN-COMMENTED THIS (This is the fix)
    volumes:
      - ./backend:/app/backend
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
    networks:
      - grade-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    environment:
      - NEXT_PUBLIC_API_URL=/api
    depends_on:
      - backend
    networks:
      - grade-net

networks:
  grade-net:
    driver: bridge