version: '3.8'

services:
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
      - frontend
    networks:
      - grade-net

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        # Demo default: Business-Plan only, no torch/RAG stack (fits 1 GB, no OOM).
        # Set BACKEND_REQUIREMENTS=requirements.txt in .env to re-enable Educator/RAG.
        - REQUIREMENTS=${BACKEND_REQUIREMENTS:-requirements-demo.txt}
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app/backend
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
    networks:
      - grade-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # The public URL is baked into the Next.js build. Set PUBLIC_API_URL in .env
        # to your host/IP (e.g. http://44.215.169.80/api) — no need to edit this file
        # on the server anymore. Falls back to localhost for local dev.
        - NEXT_PUBLIC_API_URL=${PUBLIC_API_URL:-http://127.0.0.1:8000/api}
        # Demo default: Educator workspace disabled. Set EDUCATOR_ENABLED=true in .env
        # to re-enable it.
        - NEXT_PUBLIC_EDUCATOR_ENABLED=${EDUCATOR_ENABLED:-false}
    environment:
      - NEXT_PUBLIC_API_URL=${PUBLIC_API_URL:-http://127.0.0.1:8000/api}
      - NEXT_PUBLIC_EDUCATOR_ENABLED=${EDUCATOR_ENABLED:-false}
      - BACKEND_INTERNAL_URL=http://backend:8000
    volumes:
      - ./data:/app/data
    depends_on:
      - backend
    networks:
      - grade-net

networks:
  grade-net:
    driver: bridge