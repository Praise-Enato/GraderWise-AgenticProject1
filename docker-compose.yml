version: '3.8'

services:
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
      - frontend
    networks:
      - grade-net

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    # Ports removed to internal-only communication
    # ports:
    #   - "8000:8000"
    volumes:
      - ./backend:/app/backend
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
    networks:
      - grade-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    # Ports removed to internal-only communication
    # ports:
    #   - "3000:3000"
    environment:
      # API URL is now relative because Nginx handles routing on same domain/port
      # OR it is the Host URL/Port 80.
      # For browser-side requests, it should be /api
      - NEXT_PUBLIC_API_URL=/api
    depends_on:
      - backend
    networks:
      - grade-net

networks:
  grade-net:
    driver: bridge
